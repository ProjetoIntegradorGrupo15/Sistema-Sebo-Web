<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Clientes - Acervo Sebos</title>
  <link rel="stylesheet" href="estillo.css">
</head>

<body>

<!-- MENU PADRÃO -->
<header class="topo">
  <nav>

    <div class="logo">
      <a href="index.html" class="logo-link">
        <img src="imagens/logo.png" alt="logo" class="logo-img">
      </a>
    </div>

    <div class="menu">
      <a href="principal.html">Home</a>
      <a href="acervo.html">Acervo</a>
      <a href="cadastro-acervo.html">Cadastrar Acervo</a>
      <a href="vendas.html">Vendas</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="clientes.html">Clientes</a>
      <a href="funcionarios.html">Funcionários</a>
      <a href="index.html" onclick="logout()">Sair</a>
    </div>

  </nav>
</header>


<!-- CONTEÚDO -->
 <div class="container">
                
  <!-- CADASTRO -->
  <div class="card">
    <form id="form" class="form">
     
    <h2 class="form-title">👤 Cadastro de Clientes</h2>
     <div class="form-content"> 
        <label for="login">Nome do cliente:</label>     
        <input id="nome" placeholder="">
      </div>
      
    <div class="form-content"> 
        <label for="login">Email:</label>       
        <input id="nome" placeholder="">
    </div>

    <button onclick="salvarCliente()">Salvar</button>

    <p id="msg"></p>
  </div>

  <!-- LISTA -->
  <div class="card">
    <h3>📋 Lista de Clientes</h3>
    <ul id="lista-clientes"></ul>
  </div>

</div>

<!-- FOOTER -->
<footer>
  <p>© 2026 Acervo Sebos</p>
</footer>

<!-- PROTEÇÃO LOGIN -->
<script src="js/auth.js"></script>

<!-- SCRIPT -->
<script>

// LOGOUT
function logout(){
  localStorage.removeItem("logado");
}

// SALVAR CLIENTE
function salvarCliente(){
  let nome = document.getElementById("nome").value;
  let email = document.getElementById("email").value;

  if(!nome || !email){
    msg.innerText = "Preencha todos os campos!";
    msg.style.color = "red";
    return;
  }

  let clientes = JSON.parse(localStorage.getItem("clientes")) || [];

  clientes.push({nome, email});

  localStorage.setItem("clientes", JSON.stringify(clientes));

  msg.innerText = "Cliente cadastrado!";
  msg.style.color = "green";

  document.getElementById("nome").value = "";
  document.getElementById("email").value = "";

  carregarClientes();
}

// CARREGAR CLIENTES
function carregarClientes(){
  let clientes = JSON.parse(localStorage.getItem("clientes")) || [];
  let lista = document.getElementById("lista-clientes");

  lista.innerHTML = "";

  clientes.forEach(c => {
    lista.innerHTML += `<li>${c.nome} - ${c.email}</li>`;
  });
}

carregarClientes();

</script>

</body>
</html>
