<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Vendas - Acervo Sebos</title>
  <link rel="stylesheet" href="estillo.css">
</head>

<body>

<!-- MENU PADRÃO -->
<header class="topo">
  <nav>

    <div class="logo">
      <a href="index.html" class="logo-link">
        <img src="imagens/logo.png" alt="logo" class="logo-img">
      </a>
    </div>

    <div class="menu">
      <a href="principal.html">Home</a>
      <a href="acervo.html">Acervo</a>
      <a href="cadastro-acervo.html">Cadastrar Acervo</a>
      <a href="gerenciar-acervo.html">Gerenciar Acervo</a>
      <a href="vendas.html">Vendas</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="clientes.html">Clientes</a>
      <a href="funcionarios.html">Funcionários</a>
      <a href="index.html" onclick="logout()">Sair</a>
    </div>

  </nav>
</header>

<!-- CONTEÚDO -->
<div class="container">

  <div class="card">
    <form id="form" class="form">
     
  <h2 class="form-title">💰 Registrar Venda</h2>
    <div class="form-content">
      <label for="livro">Livro:</label>           
      <input id="nome" placeholder="">
    </div>      
    <div class="form-content">
      <label for="cliente">Cliente:</label>          
      <input id="nome" placeholder="">
      </div>
    <div class="form-content">
      <label for="nome">Valor:</label>           
        <input id="nome" placeholder="">
    </div>
    
   <button onclick="registrarVenda()">Registrar</button>

    <p id="msg"></p>
  </div>

  <!-- LISTA DE VENDAS -->
  <div class="card">
    <h3>📊 Histórico de Vendas</h3>
    <ul id="lista-vendas"></ul>
  </div>

</div>

<!-- FOOTER -->
<footer>
  <p>© 2026 Acervo Sebos</p>
</footer>

<!-- PROTEÇÃO LOGIN -->
<script src="js/auth.js"></script>

<!-- SCRIPT -->
<script>

// LOGOUT
function logout(){
  localStorage.removeItem("logado");
}

// REGISTRAR VENDA
function registrarVenda(){
  let livro = document.getElementById("livro").value;
  let cliente = document.getElementById("cliente").value;
  let valor = document.getElementById("valor").value;

  if(!livro || !cliente || !valor){
    msg.innerText = "Preencha todos os campos!";
    msg.style.color = "red";
    return;
  }

  let vendas = JSON.parse(localStorage.getItem("vendas")) || [];

  vendas.push({livro, cliente, valor});

  localStorage.setItem("vendas", JSON.stringify(vendas));

  msg.innerText = "Venda registrada!";
  msg.style.color = "green";

  document.getElementById("livro").value = "";
  document.getElementById("cliente").value = "";
  document.getElementById("valor").value = "";

  carregarVendas();
}

// CARREGAR VENDAS
function carregarVendas(){
  let vendas = JSON.parse(localStorage.getItem("vendas")) || [];
  let lista = document.getElementById("lista-vendas");

  lista.innerHTML = "";

  vendas.forEach(v => {
    let item = `<li>${v.livro} - ${v.cliente} - R$ ${v.valor}</li>`;
    lista.innerHTML += item;
  });
}

carregarVendas();

</script>

</body>
</html>
