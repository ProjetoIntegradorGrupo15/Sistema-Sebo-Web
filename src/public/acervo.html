<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Acervo - Acervo Sebos</title>
    <link rel="stylesheet" href="estillo.css">
</head>
<body>
  
    <header class="topo">
        <nav>
            <div class="logo">
                <a href="index.html" class="logo-link">
                    <img src="imagens/logo.png" alt="logo" class="logo-img">
                </a>
            </div>
            <div class="menu">
                <a href="principal.html">Home</a>
                <a href="acervo.html">Acervo</a>
                <a href="cadastro-acervo.html">Cadastrar Acervo</a>
                <a href="vendas.html">Vendas</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="clientes.html">Clientes</a>
                <a href="funcionarios.html">Funcionários</a>
                <a href="index.html" onclick="logout()">Sair</a>
            </div>
        </nav>
    </header>

  
    <section class="hero">
        <h2>📚 Biblioteca Digital</h2>
        <p>Explore nossos livros disponíveis</p>
    </section>

    <!-- BUSCA -->
        <form id="form" class="form" onsubmit="event.preventDefault();">
        <div class="container" style="max-width: 800px; margin: 0 auto; padding: 20px;">
            <label for="search" style="display: block; margin-bottom: 6px; font-weight: bold;">Buscar livros:</label>
            <div style="display: flex; gap: 10px; width: 100%;">
                <input type="text" id="search" placeholder="Digite o título ou o autor..." style="flex: 1; margin: 0;">
                <button type="submit" id="btnBuscar" style="height: auto; padding: 12px 25px; white-space: nowrap;">Enviar</button>
            </div>
        </div>
    </form>


    <!-- CONTEÚDO -->
    <main class="container">
        <h2 class="titulo-secao">Livros Disponíveis</h2>        

        <div class="livros-grid" id="lista-livros"></div>
        
        <p id="nenhum-resultado" style="display:none; text-align: center; font-weight: bold; margin-top: 20px;">
            Nenhum livro encontrado 😢
        </p>
    </main>
    


    <footer>
        <p>© 2026 Acervo Sebos</p>
    </footer>

    <!-- PROTEÇÃO LOGIN -->
    <script src="js/auth.js"></script>    

    <script src="acervo.js"></script>
</body>
</html>
